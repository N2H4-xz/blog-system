server:
  port: 8080

spring:
  application:
    name: blog-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/blog_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    time-zone: Asia/Shanghai

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:false}
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  redis:
    enabled: ${APP_REDIS_ENABLED:true}
  jwt:
    issuer: blog-system
    secret: ${JWT_SECRET:dev-secret-dev-secret-dev-secret-dev-secret}
    access-token-expiry-minutes: 120
    refresh-token-expiry-days: 7
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
