spring:
  datasource:
    url: jdbc:h2:mem:blog;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  bootstrap:
    enabled: false
  jwt:
    issuer: blog-system-test
    secret: test-secret-test-secret-test-secret-123456
    access-token-expiry-minutes: 120
    refresh-token-expiry-days: 7
  cors:
    allowed-origins: http://localhost:5173
